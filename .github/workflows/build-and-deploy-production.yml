name: Deploy Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1: Build & Push Docker Image to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=main

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Deploy via Hostinger Docker Manager API
  # ==========================================
  deploy:
    name: Deploy to Production (Hostinger)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Substitute environment variables in docker-compose.yml
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: ${{ secrets.DB_SSL }}
          IMAGE_TAG: main
        run: |
          envsubst < infra/prod/docker-compose.yml > /tmp/docker-compose-deploy.yml
          # Não imprimir o arquivo: ele contém os segredos já substituídos
          # e os logs do Actions são públicos neste repositório.
          echo "docker-compose.yml gerado ($(wc -l < /tmp/docker-compose-deploy.yml) linhas)."

      - name: Deploy Docker project on Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: |
          # Monta o JSON com jq para escapar corretamente os valores dos segredos
          # (sem interpolá-los diretamente no script).
          jq -n \
            --arg project_name "$PROJECT_NAME" \
            --rawfile content /tmp/docker-compose-deploy.yml \
            --arg environment "$(printf 'DISCORD_TOKEN=%s\nDISCORD_CLIENT_ID=%s\nDATABASE_URL=%s\nDB_SSL=%s' \
                "$DISCORD_TOKEN" "$DISCORD_CLIENT_ID" "$DATABASE_URL" "$DB_SSL")" \
            '{project_name: $project_name, content: $content, environment: $environment}' \
            > /tmp/deploy-payload.json

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${HOSTINGER_VPS_ID}/docker" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deploy-payload.json)

          rm -f /tmp/deploy-payload.json /tmp/docker-compose-deploy.yml

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            # A resposta pode ecoar o conteúdo enviado; só exibir em caso de falha.
            echo "Response: $BODY"
            echo "❌ Falha ao criar projeto. Status: $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Projeto '${{ env.PROJECT_NAME }}' criado/atualizado com sucesso!"
