services:
  discord-bot-dilo:
    image: ghcr.io/devyor-dot-fun/discord-bot-dilo:${IMAGE_TAG:-main}
    container_name: discord-bot-dilo-production
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DATABASE_URL=${DATABASE_URL}
      - DB_SSL=${DB_SSL:-false}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - shared-proxy-network

networks:
  shared-proxy-network:
    external: true
